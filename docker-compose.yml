services:
  mls_api:
    container_name: mls_api
    image: "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    environment:
      - NODE_ENV=production
      - PORT
      - TOKEN_KEY
      - TOKEN_EXPIRY
      - SENDGRID_API_KEY
      - SENDGRID_EMAIL
      - FRONTEND_URL
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_PHONE_NUMBER
      - OTP_TTL
      - OTP_KEY
      - MYSQL_HOST
      - MYSQL_DATABASE
      - MYSQL_PORT
      - MYSQL_USER
      - MYSQL_PASSWORD
      - BACK_BLAZE_KEY_ID
      - BUCKET_NAME
      - BACK_BALZE_APP_KEY
      - BUCKET_ID
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${DOCKER_EXPOSED_PORT}:${DOCKER_APPLICATION_PORT}
    links:
      - mls_db
  


  mls_db:
    container_name: mls_db
    image: mysql:latest
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}