services:
  mls_api:
    image: "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    environment:
      - NODE_ENV=production
      - PORT
      - TOKEN_KEY
      - TOKEN_EXPIRY
      - SENDGRID_API_KEY
      - SENDGRID_EMAIL
      - FRONTEND_URL
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_PHONE_NUMBER
      - OTP_TTL
      - OTP_KEY
      - DB_HOST
      - DB_PORT
      - DB_USERNAME
      - DB_PASS
      - BACK_BLAZE_KEY_ID
      - BUCKET_NAME
      - BACK_BALZE_APP_KEY
      - BUCKET_ID
    env_file:
      - ./.env
#      - SECRET_KEY_FILE= /run/secrets/secret_key
    build:
      # secrets:
      #   - DOCKER_EXPOSED_PORT
      #   - DOCKER_APPLICATION_PORT
      context: .
      dockerfile: Dockerfile
    ports:
     - ${DOCKER_EXPOSED_PORT}:${DOCKER_APPLICATION_PORT}



  mls_db:
    image: mysql:latest
    ports:
      - ${MYSQL_DB_PORT}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_DB_HOST=${MYSQL_DB_HOST}
      - MYSQL_DB_USERNAME=${MYSQL_DB_USERNAME}
      - MYSQL_DB_PASS=${MYSQL_DB_PASS}
      - MYSQL_DB_PORT=${MYSQL_DB_PORT}



