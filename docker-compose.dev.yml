services:
  mls_api:
    container_name: dev_mls_api
    image: "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    environment:
      - NODE_ENV=production
      - PORT
      - TOKEN_KEY
      - TOKEN_EXPIRY
      - SENDGRID_API_KEY
      - SENDGRID_EMAIL
      - TWILIO_ACCOUNT_SID
      - TWILIO_AUTH_TOKEN
      - TWILIO_PHONE_NUMBER
      - OTP_TTL
      - OTP_KEY
      - MYSQL_HOST
      - MYSQL_DATABASE
      - MYSQL_PORT
      - MYSQL_USER
      - MYSQL_PASSWORD
      - BACK_BLAZE_KEY_ID
      - BUCKET_NAME
      - BACK_BALZE_APP_KEY
      - BUCKET_ID
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - ${DEV_DOCKER_EXPOSED_PORT}:${DOCKER_APPLICATION_PORT}
  


  mls_db:
    container_name: dev_mls_db
    image: mysql:latest
    ports:
      - ${DEV_MYSQL_PORT}:${DEV_MYSQL_PORT}
    environment:
      - MYSQL_ROOT_PASSWORD=${DEV_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DEV_MYSQL_DATABASE}
      - MYSQL_USER=${DEV_MYSQL_USER}
      - MYSQL_PASSWORD=${DEV_MYSQL_PASSWORD}
      - MYSQL_TCP_PORT=${DEV_MYSQL_PORT}

    volumes:
      - dev_mls_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p${DEV_MYSQL_ROOT_PASSWORD}", "-h", "dev_mls_db", "-e", "USE ${DEV_MYSQL_DATABASE};"]
      retries: 10

volumes:
  dev_mls_database: